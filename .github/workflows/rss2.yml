name: RSS Content Analyzer

on:
  schedule:
    - cron: '30 2 * * *'      # 每天 UTC 时间 8 点运行
  workflow_dispatch:         # 允许手动触发

jobs:
  analyze_rss:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
      # Repository Variables (not Secrets): use "false" for models that do
      # not support response_format=json_object; leave unset to keep it on.
      OPENROUTER_USE_STRUCTURED_OUTPUT: ${{ vars.OPENROUTER_USE_STRUCTURED_OUTPUT }}
      # Set to "true" temporarily to include a truncated raw provider response
      # in the Actions log when a 200 response has no message.content.
      OPENROUTER_DEBUG_RESPONSES: ${{ vars.OPENROUTER_DEBUG_RESPONSES }}
      # Increase this when a reasoning model reaches the output limit before
      # returning content. Leave unset to use the script default (2048).
      OPENROUTER_MAX_TOKENS: ${{ vars.OPENROUTER_MAX_TOKENS }}
      # Leave unset to use a model's default reasoning behavior. Set to false
      # to request final JSON directly; a rejected parameter is auto-retried
      # without it.
      OPENROUTER_REASONING_ENABLED: ${{ vars.OPENROUTER_REASONING_ENABLED }}
      # Optional comma-separated fallback model IDs, in priority order.
      OPENROUTER_FALLBACK_MODELS: ${{ vars.OPENROUTER_FALLBACK_MODELS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4 python-dotenv

      - name: Run Python script
        run: python scripts/rss_analyzer.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-commit: Update data.json"
          file_pattern: "data.json scripts/processed_links.json scripts/source_cursor.json"
